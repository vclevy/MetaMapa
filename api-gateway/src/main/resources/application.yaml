server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      forwarded:
        enabled: true

      routes:
        - id: auth_service_route
          uri: ${AUTH_URI}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /${segment}

        - id: agregador_route
          uri: ${AGREGADOR_URI}
          predicates:
            - Path=/api/agregador/**
          filters:
            - RewritePath=/api/agregador/(?<segment>.*), /${segment}

        - id: fuentedinamica_route
          uri: ${FUENTE_DINAMICA_URI}
          predicates:
            - Path=/api/fuente-dinamica/**
          filters:
            - RewritePath=/api/fuente-dinamica/(?<segment>.*), /${segment}

        - id: fuenteestatica_route
          uri: ${FUENTE_ESTATICA_URI}
          predicates:
            - Path=/api/fuente-estatica/**
          filters:
            - RewritePath=/api/fuente-estatica/(?<segment>.*), /${segment}

        - id: fuenteproxy_route
          uri: ${FUENTE_PROXY_URI}
          predicates:
            - Path=/api/fuente-proxy/**
          filters:
            - RewritePath=/api/fuente-proxy/(?<segment>.*), /${segment}

        - id: servicioestadisticas_route
          uri: ${ESTADISTICAS_URI}
          predicates:
            - Path=/api/estadisticas/**
          filters:
            - RewritePath=/api/estadisticas/(?<segment>.*), /estadisticas/${segment}