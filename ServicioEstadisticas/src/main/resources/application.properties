spring.application.name=ServicioEstadisticas
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
##server.port=8084
##spring.datasource.url=jdbc:mysql://localhost:3306/servicioEstadisticas_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
##spring.datasource.username=root
##spring.datasource.password=12345678
##spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=${SERVER_PORT}

# Exponer todos los endpoints de Actuator (incluye /actuator/metrics)
management.endpoints.web.exposure.include=*

# Habilitar Datadog
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.api-key=e106ceff48cb70c8b2cc1a183c2cb02d
management.datadog.metrics.export.site=us5.datadoghq.com
management.datadog.metrics.export.step=10s

# Identificadores del servicio (opcional pero recomendado)
dd.service=estadisticas
dd.env=dev

gateway.url=${GATEWAY_URL}
