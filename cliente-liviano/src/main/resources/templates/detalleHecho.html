<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del Hecho</title>

    <!-- CSS de detalle del hecho -->
    <link rel="stylesheet" th:href="@{/css/detalleHecho.css}" />

    <!-- CSS del header -->
    <link rel="stylesheet" th:href="@{/css/header.css}" />

    <style>
        /* Flex container para imagen y detalles */
        .detalle-flex {
            display: flex;
            align-items: flex-start;
            gap: 2rem;
        }

        /* Imagen/carrusel */
        .carousel {
            position: relative;
            width: 300px;
            height: 300px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .carousel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .carousel img.active {
            display: block;
        }
        .carousel .prev, .carousel .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0,0,0,0.4);
            color: white;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 50%;
        }
        .carousel .prev { left: 10px; }
        .carousel .next { right: 10px; }

        /* Detalles del hecho */
        .detalle-flex .detalle-hecho {
            flex: 1;
        }

        /* Responsivo: imagen arriba en pantallas pequeñas */
        @media (max-width: 600px) {
            .detalle-flex {
                flex-direction: column;
                align-items: center;
            }
            .carousel {
                width: 100%;
                height: auto;
            }
            .carousel img {
                height: auto;
            }
            .detalle-flex .detalle-hecho {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- Header importado -->
<div th:replace="header :: mainHeader"></div>

<div class="container detalle-flex">

    <!-- Carrusel de imágenes -->
    <div th:if="${hecho.multimedia != null and !#lists.isEmpty(hecho.multimedia)}" class="carousel">
        <div th:each="img, iterStat : ${hecho.multimedia}">
            <img th:src="${img}" alt="Imagen del hecho"
                 th:classappend="${iterStat.index == 0} ? 'active' : ''"/>
        </div>

        <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="next" onclick="moveSlide(1)">&#10095;</button>
    </div>

    <!-- Detalles del hecho -->
    <div class="detalle-hecho">
        <h1 th:text="${hecho.titulo}">Título del Hecho</h1>

        <p><strong>Subido por:</strong>
            <span th:text="${hecho.nombreDeUsuario != null ? hecho.nombreDeUsuario : 'Anónimo'}"></span>
        </p>

        <p><strong>Descripción:</strong> <span th:text="${hecho.descripcion}">Descripción del hecho</span></p>

        <p><strong>Categoría:</strong> <span th:text="${hecho.categoriaNombre}">Categoría del hecho</span></p>

        <p><strong>Fecha del acontecimiento:</strong>
            <span th:text="${fechaFormateada}"></span>
        </p>

        <p><strong>Ubicación:</strong>
            <span th:if="${hecho.lugar.latitud != null and hecho.lugar.longitud != null}"
                  th:text="${hecho.lugar.provincia}"></span>
            <span th:if="${hecho.lugar.latitud == null or hecho.lugar.longitud == null}">Ubicación no disponible</span>
        </p>
        <!-- Botón para solicitar eliminación -->
        <div class="actions" style="margin-top:1.5rem;">
            <a class="btn btn-outline btn-solicitar" th:href="@{/hechos/{id}/solicitar-eliminacion(id=${hecho.id})}">
                Solicitar eliminación
            </a>
        </div>
    </div>


</div>

<script>
    let currentSlide = 0;

    function showSlide(index) {
        const slides = document.querySelectorAll(".carousel img");
        if (slides.length === 0) return;
        slides.forEach(slide => slide.classList.remove("active"));
        currentSlide = (index + slides.length) % slides.length;
        slides[currentSlide].classList.add("active");
    }

    function moveSlide(step) {
        showSlide(currentSlide + step);
    }

    document.addEventListener("DOMContentLoaded", () => {
        showSlide(0);
    });
</script>
</body>
</html>
