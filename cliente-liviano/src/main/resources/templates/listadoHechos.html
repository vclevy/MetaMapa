<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MetaMapa — Hechos</title>
    <link rel="stylesheet" th:href="@{/css/listadoHechos.css}" />
</head>
<body>

<header>
    <div class="header-container">
        <a class="logo" th:href="@{/}">
            <img th:src="@{/img/logoMetamapa.png}" alt="Logo MetaMapa" />
        </a>
        <nav class="nav-links">
            <a class="btn btn-primary" th:href="@{/login}">Iniciar sesión</a>
            <a class="btn btn-primary" th:href="@{/registro}">Registrarse</a>
        </nav>
    </div>
</header>

<main>
    <section class="intro container">
        <h1>Hechos</h1>
        <p>Explorá y filtrá los hechos reportados por la comunidad.</p>
    </section>

    <!-- Filtros -->
    <section class="filters container">
        <form class="filters-form" method="get" th:action="@{/hechos}">
            <div class="filter-group">
                <label for="fecha-desde">Fecha desde</label>
                <input type="date" id="fecha-desde" name="desde" th:value="${desde}">
            </div>

            <div class="filter-group">
                <label for="fecha-hasta">Fecha hasta</label>
                <input type="date" id="fecha-hasta" name="hasta" th:value="${hasta}">
            </div>

            <div class="filter-group">
                <label for="ubicacion">Ubicación</label>
                <input type="text" id="ubicacion" name="ubicacion" placeholder="Barrio, calle o ciudad"
                       th:value="${ubicacion}">
            </div>

            <div class="filter-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" th:value="${categoria}">
                    <option value="">Todas</option>
                    <option value="memoria" th:selected="${categoria=='memoria'}">Memoria</option>
                    <option value="derechos" th:selected="${categoria=='derechos'}">Derechos humanos</option>
                    <option value="movilizacion" th:selected="${categoria=='movilizacion'}">Movilización</option>
                    <option value="cultura" th:selected="${categoria=='cultura'}">Cultura</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="fuente">Fuente</label>
                <select id="fuente" name="fuente" th:value="${fuente}">
                    <option value="">Todas</option>
                    <option value="ciudadana" th:selected="${fuente=='ciudadana'}">Dinámica</option>
                    <option value="prensa" th:selected="${fuente=='prensa'}">Estática</option>
                    <option value="archivo" th:selected="${fuente=='archivo'}">Proxy</option>
                </select>
            </div>

            <div class="filter-actions">
                <button type="submit" class="btn btn-primary">Filtrar</button>
                <a th:href="@{/hechos}" class="btn btn-primary">Limpiar</a>
            </div>
        </form>
    </section>

    <!-- Listado -->
    <section class="hechos-list">
        <div class="cards container">
            <article class="card" th:each="hecho : ${hechos}">
                <div th:if="${hecho.multimedia != null and hecho.multimedia != ''}">
                    <a class="card-cover" th:href="@{|/hechos/${hecho.id}|}">
                        <img th:src="${hecho.multimedia}" th:alt="|Imagen del hecho ${hecho.titulo}|"/>
                    </a>
                </div>

                <div class="card-body">
                    <h3 th:text="${hecho.titulo}">Título del hecho</h3>
                    <p class="meta">
                        <span th:text="${#temporals.format(hecho.fechaDeAcontecimiento, 'dd/MM/yyyy')}"></span>
                        <!-- Fuente opcional, solo si existe -->
                        <!--    <span class="badge alt" th:if="${hecho.fuente != null}" th:text="${hecho.fuente}"></span>-->
                       </p>
                       <p th:text="${hecho.descripcion}">Descripción breve del hecho…</p>
                       <a th:href="@{|/hechos/${hecho.id}|}" class="card-link">Ver detalle</a>
                   </div>
               </article>
           </div>

           <!-- Paginación -->
        <nav class="pagination" aria-label="Paginación">
            <a class="page prev" th:href="@{|/hechos?page=${paginaAnterior}|}">Anterior</a>
            <span th:each="i : ${#numbers.sequence(1,totalPaginas)}">
                <a class="page" th:classappend="${i==paginaActual} ? ' is-current'"
                   th:href="@{|/hechos?page=${i}|}" th:text="${i}">1</a>
            </span>
            <a class="page next" th:href="@{|/hechos?page=${paginaSiguiente}|}">Siguiente</a>
        </nav>
    </section>
</main>

<footer>
    <p>© 2025 MetaMapa — Todos los derechos reservados</p>
</footer>
</body>
</html>
