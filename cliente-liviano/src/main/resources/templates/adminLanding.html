<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetaMapa · Resumen de actividad</title>
    <link rel="stylesheet" th:href="@{/css/adminLanding.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/adminSidebar.css}" />
</head>
<body>
<!-- Header con logo -->
<div th:replace="header :: mainHeader"></div>

<div class="layout">
    <!-- Sidebar -->
    <div th:replace="adminSidebar :: sidebarFragment"></div>

    <!-- Contenido -->
    <main class="main" role="main">
        <section class="dashboard-grid">
            <article class="card card--kpis" aria-labelledby="kpis-title">
                <h2 id="kpis-title" class="card__title">Hechos cargados en el último mes · Totales</h2>
                <div class="kpis-two">
                    <div class="kpi-block">
                        <div class="kpi__label">Último mes</div>
                        <div class="kpi__value">128</div>
                    </div>
                    <div class="kpi-block">
                        <div class="kpi__label">Totales</div>
                        <div class="kpi__value">2.431</div>
                    </div>
                </div>
            </article>
            <!-- Aquí podés agregar más cards o widgets hardcodeados -->
        </section>
    </main>
</div>

<!-- Footer -->
<footer role="contentinfo">
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>

<!-- Toggle sidebar en mobile -->
<script th:inline="javascript">
    /*<![CDATA[*/
    (function(){
        const btn = document.querySelector('.sidebar__toggle');
        const sidebar = document.querySelector('.sidebar');
        if(!btn || !sidebar) return;
        btn.addEventListener('click', () => {
            const open = sidebar.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', String(open));
        });
    })();
    /*]]>*/
</script>
</body>
</html>
