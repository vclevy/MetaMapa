<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaMapa - Registro de Contribuyentes</title>
    <link rel="stylesheet" href="../static/css/sesion.css">
    <link rel="stylesheet" th:href="@{/css/header.css}" /> <!-- Header CSS -->

</head>
<body>
<div th:replace="header :: mainHeader"></div>

<main class="main-content">
    <section class="intro">
        <h2>Registro de contribuyentes</h2>
        <p>Unite a MetaMapa y ayudanos a mapear la memoria colectiva</p>
        <p>
            Si ya tenés una cuenta, debés
            <a href="inicioSesion.html">iniciar sesión</a>.
        </p>
    </section>

    <section class="form-section">
        <form class="form-card">
            <label for="nombre">Nombre <span style="color:red">*</span></label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Tu apellido">

            <label for="usuario">Nombre de usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Elegí un usuario">

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">

            <label for="clave">Contraseña <span style="color:red">*</span></label>
            <input type="password" id="clave" name="clave" placeholder="Ingresá una contraseña segura">

            <button type="submit" class="btn btn-primary">Registrarme</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>
</body>
</html>

<script>
    document.querySelector(".form-card").addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
            nombre: document.getElementById("nombre").value,
            apellido: document.getElementById("apellido").value,
            nombreDeUsuario: document.getElementById("usuario").value,
            email: document.getElementById("email").value,
            contrasenia: document.getElementById("clave").value
        };

        try {
            const res = await fetch("http://localhost:8080/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await res.json();

            if (res.ok) {
                alert("Usuario registrado! Token: " + result.token);
                // Guardar token en localStorage y redirigir
                localStorage.setItem("jwt", result.token);
                window.location.href = "inicioSesion.html";
            } else {
                alert("Error: " + result);
            }
        } catch (err) {
            console.error(err);
            alert("Error en la conexión al servidor");
        }
    });
</script>
