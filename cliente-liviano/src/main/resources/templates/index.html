<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaMapa - Landing</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>

<header>
    <div class="header-container">
        <a class="logo" th:href="@{/}">
            <img th:src="@{/img/logoMetamapa.png}" alt="Logo MetaMapa" />
        </a>
        <nav class="nav-links">
            <a class="btn btn-primary" th:href="@{/inicioSesion}">Iniciar sesión</a>
            <a class="btn btn-primary" th:href="@{/registro}">Registrarse</a>
        </nav>
    </div>
</header>

<!-- Banner -->
<div id="banner">
    <div class="banner-texto">
        <h1>Mapeo colaborativo de la información</h1>
        <div class="banner-botones">
            <a class="btn btn-outline" th:href="@{/hechos}">Ver hechos</a>
            <a class="btn btn-outline" th:href="@{/hechos/subir}">Subir hecho</a>
            <a class="btn btn-outline" th:href="@{/colecciones}">Ver colecciones</a>
        </div>
    </div>
</div>

<!-- Mapa debajo del banner -->
<section class="map-section container">
    <div id="map"></div>
</section>

<!-- Hechos destacados -->
<section class="destacados container">
    <h2>Hechos destacados</h2>
    <div class="cards">
        <div class="card" th:each="hecho : ${destacados}">
            <div th:if="${hecho.multimedia != null and !#lists.isEmpty(hecho.multimedia)}">
                <img th:src="${hecho.multimedia[0]}" th:alt="|Imagen del hecho ${hecho.titulo}|" />
            </div>
            <div class="card-body">
                <h3 th:text="${hecho.titulo}">Título del hecho</h3>
                <p th:text="${hecho.descripcion}">Descripción breve...</p>
            </div>
        </div>
    </div>
</section>

<footer>
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>

<script>
    const map = L.map('map').setView([-34.6037, -58.3816], 13); // Buenos Aires

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Ejemplo de marcador de hechos destacados en el mapa
    /*
    th:each="hecho : ${destacados}"
    Se podría hacer con un script dinámico Thymeleaf si cada hecho tiene coordenadas
    */
</script>

</body>
</html>
