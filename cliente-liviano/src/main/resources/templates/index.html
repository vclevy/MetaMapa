<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaMapa - Landing</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <link rel="stylesheet" th:href="@{/css/map.css}" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>

<header>
    <div class="header-container">
        <a class="logo" th:href="@{/}">
            <img th:src="@{/img/logoMetamapa.png}" alt="Logo MetaMapa" />
        </a>
        <nav class="nav-links">
            <a class="btn btn-primary" th:href="@{/inicioSesion}">Iniciar sesión</a>
            <a class="btn btn-primary" th:href="@{/registro}">Registrarse</a>
        </nav>
    </div>
</header>

<!-- Banner -->
<div id="banner">
    <div class="banner-texto">
        <h1>Mapeo colaborativo de la información</h1>
        <div class="banner-botones">
            <a class="btn btn-outline" th:href="@{/hechos}">Ver hechos</a>
            <a class="btn btn-outline" th:href="@{/hechos/subir}">Subir hecho</a>
            <a class="btn btn-outline" th:href="@{/colecciones}">Ver colecciones</a>
        </div>
    </div>
</div>

<!-- Mapa debajo del banner -->
<section class="map-section container">
    <div id="map"></div>
</section>

<footer>
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>


<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<!-- Script dinámico para cargar hechos -->
<script>
    const map = L.map('map').setView([-34.6037, -58.3816], 13); // Centro inicial

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);

    // Función para agregar hechos al mapa
    function agregarHechos(hechos) {
        markersLayer.clearLayers();

        hechos.forEach(hecho => {
            if (hecho.latitud && hecho.longitud) {
                let popupContent = `
                <div class="card">
                    ${hecho.multimedia && hecho.multimedia.length > 0 ? `
                        <div>
                            <a href="/hechos/${hecho.id}">
                                <img src="${hecho.multimedia[0]}" alt="Imagen del hecho ${hecho.titulo}" />
                            </a>
                        </div>
                    ` : ''}
                    <div class="card-body">
                        <h3>${hecho.titulo}</h3>
                        <p><small>${new Date(hecho.fechaDeAcontecimiento).toLocaleDateString()}</small></p>
                        <p>${hecho.descripcion ?? ''}</p>
                        <a href="/hechos/${hecho.id}" class="card-link">Ver detalle</a>
                    </div>
                </div>
            `;
                L.marker([hecho.latitud, hecho.longitud])
                    .addTo(markersLayer)
                    .bindPopup(popupContent);
            }
        });

        // Ajustar mapa para que entren todos los pins
        if (markersLayer.getLayers().length > 0) {
            const group = L.featureGroup(markersLayer.getLayers());
            map.fitBounds(group.getBounds(), { padding: [50, 50] });
        }
    }

    // Cargar todos los hechos al inicio
    async function cargarTodosHechos() {
        try {
            const response = await fetch('/hechos/all'); // Endpoint que devuelve todos los hechos
            if (!response.ok) throw new Error('Error al cargar todos los hechos');

            const hechos = await response.json();
            agregarHechos(hechos);
        } catch (error) {
            console.error(error);
        }
    }

    // Cargar hechos dinámicamente según bounds cuando se mueve el mapa
    async function cargarHechosEnVista() {
        const bounds = map.getBounds();
        const url = `/hechos/bounds?south=${bounds.getSouth()}&west=${bounds.getWest()}&north=${bounds.getNorth()}&east=${bounds.getEast()}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Error al cargar hechos en vista');

            const hechos = await response.json();
            agregarHechos(hechos);
        } catch (error) {
            console.error(error);
        }
    }

    // Primer carga: todos los hechos
    cargarTodosHechos();

    // Actualizar al mover/zoom
    map.on('moveend', cargarHechosEnVista);
</script>


</body>
</html>
