<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetaMapa · Nueva colección</title>
    <link rel="stylesheet" th:href="@{/css/adminNuevaColeccion.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
</head>
<body>
<!-- Header -->
<div th:replace="header :: mainHeader"></div>

<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Menú lateral">
        <button class="sidebar__toggle" aria-label="Abrir/cerrar menú" aria-expanded="false">☰</button>
        <div class="sidebar__inner">
            <nav class="menu">
                <a class="menu__link" href="adminLanding.html">Resumen de actividad</a>
                <a class="menu__link is-active" href="adminColecciones.html">Gestionar colecciones</a>
                <a class="menu__link" href="adminHechos.html">Gestionar hechos</a>
                <a class="menu__link" href="adminSolicitudes.html">Solicitudes de eliminación</a>
                <a class="menu__link" href="adminImportar.html">Importar hechos</a>
            </nav>
        </div>
    </aside>

    <!-- Contenido -->
    <main class="main" role="main">
        <!-- Cabecera del form: título + botón -->
        <div class="form-header">
            <h1 class="page-title">Nueva colección</h1>
            <a class="btn btn--outline" href="adminColecciones.html" title="Volver a colecciones">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 3L2 12h3v8h6v-5h2v5h6v-8h3z"/>
                </svg>
                Volver a colecciones
            </a>
        </div>

        <!-- Contenedor centrado del formulario -->
        <div class="form-wrapper">
            <article class="card form-card-collection">
                <form th:action="@{/coleccion/crear}" th:object="${coleccionCreateDTO}" method="post">
                    <div class="form-row">
                        <label for="titulo">Nombre de la colección</label>
                        <input type="text" id="titulo" th:field="*{titulo}" placeholder="Ej.: Incidentes en transporte público" required>
                    </div>

                    <div class="form-row">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" th:field="*{descripcion}" rows="4" placeholder="Contá brevemente…" required></textarea>
                    </div>

                    <div class="form-row">
                        <label for="algoritmo">Algoritmo de consenso</label>
                        <select id="algoritmo" th:field="*{algoritmo}" required>
                            <option value="MAYORIA_SIMPLE">Mayoría simple</option>
                            <option value="MULTIPLES_MENCIONES">Múltiples menciones</option>
                            <option value="ABSOLUTA">Unanimidad</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn--primary" type="submit">Crear colección</button>
                    </div>
                </form>
            </article>
        </div>
    </main>
</div>

<!-- Footer -->
<footer role="contentinfo">
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>

<!-- Toggle sidebar en mobile -->
<script>
    (function(){
        const btn = document.querySelector('.sidebar__toggle');
        const sidebar = document.querySelector('.sidebar');
        if(!btn || !sidebar) return;
        btn.addEventListener('click', () => {
            const open = sidebar.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', String(open));
        });
    })();
</script>
</body>
</html>
