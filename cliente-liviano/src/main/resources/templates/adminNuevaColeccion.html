<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetaMapa · Nueva colección</title>
    <link rel="stylesheet" href="../static/css/adminLanding.css" />
</head>
<body>
<!-- Header -->
<header role="banner">
    <div class="header-container">
        <a class="logo" href="index.html" aria-label="Ir al home">
            <img src="../static/img/logoMetamapa.png" alt="Logo MetaMapa" />
        </a>
        <nav class="admin-top-actions" aria-label="Acciones del admin"></nav>
    </div>
</header>

<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Menú lateral">
        <button class="sidebar__toggle" aria-label="Abrir/cerrar menú" aria-expanded="false">☰</button>
        <div class="sidebar__inner">
            <nav class="menu">
                <a class="menu__link" href="adminLanding.html">Resumen de actividad</a>
                <a class="menu__link is-active" href="adminColecciones.html">Gestionar colecciones</a>
                <a class="menu__link" href="adminHechos.html">Gestionar hechos</a>
                <a class="menu__link" href="adminSolicitudes.html">Solicitudes de eliminación</a>
                <a class="menu__link" href="adminImportar.html">Importar hechos</a>
            </nav>
        </div>
    </aside>

    <!-- Contenido -->
    <main class="main" role="main">
        <div class="page-header">
            <h1 class="page-title">Nueva colección</h1>
            <div class="page-actions">
                <a class="btn btn--outline" href="adminColecciones.html" title="Volver a colecciones">
                    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor" d="M12 3L2 12h3v8h6v-5h2v5h6v-8h3z"/>
                    </svg>
                    Volver a colecciones
                </a>
            </div>
        </div>

        <article class="card form-card-collection">
            <form class="collection-form" action="#" method="post" novalidate>
                <div class="form-row">
                    <label for="nombre">Nombre de la colección</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej.: Incidentes en transporte público" required>
                </div>

                <div class="form-row">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="4" placeholder="Contá brevemente qué agrupa esta colección…" required></textarea>
                    <p class="help">Usá una descripción clara: alcance, lugar, período, etc.</p>
                </div>

                <div class="form-row">
                    <span class="row-label">Fuentes asociadas <small>(podés elegir varias)</small></span>
                    <div class="pills" role="group" aria-label="Fuentes asociadas">
                        <input class="pill-input" type="checkbox" id="fuente-proxy"   name="fuentes" value="proxy" checked>
                        <label class="pill pill--proxy" for="fuente-proxy">Proxy</label>

                        <input class="pill-input" type="checkbox" id="fuente-dinamica" name="fuentes" value="dinamica">
                        <label class="pill pill--dinamica" for="fuente-dinamica">Dinámica</label>

                        <input class="pill-input" type="checkbox" id="fuente-estatica" name="fuentes" value="estatica">
                        <label class="pill pill--estatica" for="fuente-estatica">Estática</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="consenso">Algoritmo de consenso</label>
                    <div class="select">
                        <select id="consenso" name="consenso" required title="Elegir algoritmo de consenso">
                            <option value="mayoria" selected>Mayoría simple</option>
                            <option value="dos_tercios">Umbral 2/3</option>
                            <option value="unanimidad">Unanimidad</option>
                            <option value="ponderado">Ponderado por fuente</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="btn btn--outline" href="adminColecciones.html">Cancelar</a>
                    <button class="btn btn--primary" type="submit">Crear colección</button>
                </div>
            </form>
        </article>
    </main>
</div>

<!-- Footer -->
<footer role="contentinfo">
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>

<!-- Toggle sidebar en mobile -->
<script>
    (function(){
        const btn = document.querySelector('.sidebar__toggle');
        const sidebar = document.querySelector('.sidebar');
        if(!btn || !sidebar) return;
        btn.addEventListener('click', () => {
            const open = sidebar.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', String(open));
        });
    })();
</script>
</body>
</html>
