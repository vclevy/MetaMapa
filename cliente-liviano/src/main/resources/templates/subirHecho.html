<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Subir hecho — MetaMapa</title>

    <!-- CSS global -->
    <link rel="stylesheet" th:href="@{/css/header.css}"/>

    <!-- CSS específico de esta vista -->
    <link rel="stylesheet" th:href="@{/css/subirHecho.css}"/>

    <style>
        /* Estilos básicos para las sugerencias */
        #sugerencias {
            border: 1px solid #ccc;
            max-height: 150px;
            overflow-y: auto;
            background: white;
            list-style: none;
            padding: 0;
            margin: 0;
            position: absolute;
            width: 100%;
            z-index: 1000;
        }
        #sugerencias li {
            padding: 8px;
            cursor: pointer;
        }
        #sugerencias li:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <a class="logo" th:href="@{/}">
            <img th:src="@{/img/logoMetamapa.png}" alt="Logo MetaMapa"/>
        </a>
        <nav class="nav-links">
            <a class="btn btn-primary" th:href="@{/login}">Iniciar sesión</a>
            <a class="btn btn-primary" th:href="@{/registro}">Registrarse</a>
        </nav>
    </div>
</header>

<main>
    <section class="intro">
        <h1>Subir hecho</h1>
        <p>Cargá un nuevo hecho para contribuir a la memoria colectiva.</p>
    </section>

    <section class="form-section">
        <form class="form-card"
              th:action="@{/hechos/crear}"
              th:object="${hecho}"
              method="post"
              enctype="multipart/form-data"
              novalidate>
            <h2>Datos del hecho</h2>

            <label for="titulo">Título</label>
            <input type="text" id="titulo" th:field="*{titulo}" placeholder="Ej.: Marcha por la memoria" required>

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" th:field="*{descripcion}" rows="4" placeholder="Contá brevemente qué pasó…" required></textarea>

            <div class="grid-two">
                <div>
                    <label for="categoria">Categoría</label>
                    <input type="text" id="categoria"
                           th:field="*{categoriaNombre}"
                           placeholder="Ej.: Derechos Humanos"
                           required>
                </div>

                <div>
                    <label for="fecha">Fecha y hora</label>
                    <input type="date" id="fecha" th:field="*{fechaDeAcontecimiento}" required>
                </div>
            </div>

            <label for="ubicacion">Ubicación</label>
            <div class="input-contenedor">
                <input type="text" id="ubicacion" placeholder="Barrio, calle o punto de referencia" required>
                <ul id="sugerencias"></ul>
            </div>
            <!-- Campos ocultos para lat/lon -->
            <input type="hidden" th:field="*{latitud}" id="latitud">
            <input type="hidden" th:field="*{longitud}" id="longitud">

            <label for="multimedia">Subir multimedia</label>
            <input type="file" id="multimedia" name="multimedia" accept="image/*,video/*,audio/*" multiple>

            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </section>
</main>

<script>
    const input = document.getElementById('ubicacion');
    const latInput = document.getElementById('latitud');
    const lonInput = document.getElementById('longitud');
    const sugerenciasDiv = document.getElementById('sugerencias');

    input.addEventListener('input', async function() {
        const query = this.value;
        sugerenciasDiv.innerHTML = '';
        if (query.length < 3) return;

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const results = await response.json();

            results.forEach(place => {
                const li = document.createElement('li');
                li.textContent = place.display_name;
                li.addEventListener('click', () => {
                    input.value = place.display_name;
                    latInput.value = place.lat;
                    lonInput.value = place.lon;
                    sugerenciasDiv.innerHTML = '';
                });
                sugerenciasDiv.appendChild(li);
            });
        } catch (error) {
            console.error('Error buscando ubicación:', error);
        }
    });

    // Ocultar sugerencias si se hace click afuera
    document.addEventListener('click', function(e) {
        if (!sugerenciasDiv.contains(e.target) && e.target !== input) {
            sugerenciasDiv.innerHTML = '';
        }
    });
</script>

</body>
</html>
