<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Editar hecho — MetaMapa</title>

    <link rel="stylesheet" th:href="@{/css/header.css}"/>
    <link rel="stylesheet" th:href="@{/css/subirHecho.css}"/>

    <style>
        .alert-success{margin:1rem 0;padding:.5rem 1rem;border:1px solid green;background:#e6ffe6;color:green;border-radius:4px}
        #sugerencias_ed{border:1px solid #ccc;max-height:150px;overflow-y:auto;background:#fff;list-style:none;padding:0;margin:0;position:absolute;width:100%;max-width:400px;left:50%;transform:translateX(-50%);z-index:1000}
        #sugerencias_ed li{padding:8px;cursor:pointer}
        #sugerencias_ed li:hover{background:#f0f0f0}
    </style>
</head>
<body>

<div th:replace="~{header :: mainHeader}"></div>

<main>
    <div th:if="${mensajeExito}" class="alert-success" id="flashMessage">
        <p th:text="${mensajeExito}"></p>
    </div>

    <section class="intro">
        <h1>Editar hecho</h1>
        <p>Actualizá la información del hecho seleccionado.</p>
    </section>

    <section class="form-section">
        <!-- Importante: 'hecho' viene del model -->
        <form class="form-card"
              th:action="@{/hechos/{id}/editar(id=${hecho.id})}"
              method="post"
              enctype="multipart/form-data"
              novalidate>

            <!-- CSRF si aplica -->
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- ID -->
            <input type="hidden" name="id" th:value="${hecho.id}"/>

            <h2>Datos del hecho</h2>

            <label for="titulo_ed">Título</label>
            <input type="text" id="titulo_ed" name="titulo"
                   placeholder="Ej.: Marcha por la memoria"
                   th:value="${hecho.titulo}" required>

            <label for="descripcion_ed">Descripción</label>
            <textarea id="descripcion_ed" name="descripcion" rows="4"
                      placeholder="Contá brevemente qué pasó…" required
                      th:text="${hecho.descripcion}"></textarea>

            <div class="grid-two">
                <div>
                    <label for="categoria_ed">Categoría</label>
                    <input type="text" id="categoria_ed" name="categoriaNombre"
                           placeholder="Ej.: Derechos Humanos" required
                           th:value="${hecho.categoriaNombre}">
                </div>

                <div>
                    <label for="fecha_ed">Fecha y hora</label>
                    <input type="datetime-local" id="fecha_ed" name="fechaDeAcontecimiento" required
                           th:value="${#temporals.format(hecho.fechaDeAcontecimiento, 'yyyy-MM-dd''T''HH:mm')}">
                </div>
            </div>

            <label for="ubicacion_ed">Ubicación</label>
            <div class="input-contenedor" style="position:relative">
                <!-- visible para autocomplete; no se bindea -->
                <input type="text" id="ubicacion_ed" placeholder="Barrio, calle o punto de referencia"
                       th:value="${hecho.lugar != null ? hecho.lugar.provincia : ''}">
                <ul id="sugerencias_ed"></ul>
            </div>

            <!-- coordenadas reales: respetan la estructura de HechoDTO.lugar.* -->
            <input type="hidden" id="latitud_ed"  name="lugar.latitud"  th:value="${hecho.lugar != null ? hecho.lugar.latitud  : null}">
            <input type="hidden" id="longitud_ed" name="lugar.longitud" th:value="${hecho.lugar != null ? hecho.lugar.longitud : null}">

            <label for="multimedia_ed">Actualizar multimedia (opcional)</label>
            <input type="file" id="multimedia_ed" name="multimediaArchivos"
                   accept="image/*,video/*,audio/*" multiple>


            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>
    </section>
</main>

<!-- Tu JS de autocomplete puede leer ubicacion_ed y setear latitud_ed / longitud_ed -->
</body>
</html>
