<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 - Acceso denegado</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #333;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            background: #fff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }

        .error-code {
            font-size: 96px;
            font-weight: bold;
            color: #e74c3c;
        }

        h1 {
            font-size: 32px;
            margin: 20px 0 10px 0;
            color: #e74c3c;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background: #0F2746FF;
            padding: 12px 25px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        a:hover {
            background: #2980b9;
        }

        .emoji {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .corner-image {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 100px; /* ajustá el tamaño */
            opacity: 0.7; /* opcional, para que no distraiga */
        }
    </style>
</head>
<body>
<div class="container">
    <div class="emoji">🚫</div>
    <div class="error-code">403</div>
    <h1>Acceso denegado</h1>
    <p th:text="${mensaje != null} ? ${mensaje} : 'No tenés permiso para acceder a esta página.'"></p>
    <a th:href="@{/}">Volver al inicio</a>
    <img th:src="@{/img/vacaError.png}" alt="Logo" class="corner-image">
</div>
</body>
</html>
