<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetaMapa · Importar hechos</title>
    <link rel="stylesheet" th:href="@{/css/adminImportar.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
</head>
<body>

<!-- Header -->
<div th:replace="header :: mainHeader"></div>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Menú lateral">
        <button class="sidebar__toggle" aria-label="Abrir/cerrar menú" aria-expanded="false">☰</button>
        <div class="sidebar__inner">
            <nav class="menu">
                <a class="menu__link" th:href="@{/admin}">Resumen de actividad</a>
                <a class="menu__link" th:href="@{/admin/colecciones}">Gestionar colecciones</a>
                <a class="menu__link" th:href="@{/admin/hechos}">Gestionar hechos</a>
                <a class="menu__link" th:href="@{/admin/solicitudes}">Solicitudes de eliminación</a>
                <a class="menu__link is-active" th:href="@{/admin/importar}">Importar hechos</a>
            </nav>
        </div>
    </aside>

    <!-- Contenido -->
    <main class="main" role="main">
        <div class="page-header">
            <h1 class="page-title">Importar hechos</h1>
        </div>

        <!-- Mensajes flash dinámicos -->
        <div id="mensaje" class="alert" style="display:none;"></div>

        <article class="card import-card">
            <div class="import-form">
                <p class="import-help">Cargar archivo con extensión <strong>.csv</strong></p>

                <div class="dropzone" id="dropzone" tabindex="0" aria-label="Área para seleccionar o soltar un archivo .csv">
                    <input type="file" id="csvFile" accept=".csv" required>
                    <button class="file-trigger" type="button" aria-controls="csvFile">Examinar…</button>
                    <span class="file-hint">o arrastrá y soltá aquí</span>
                    <span class="file-name" id="fileName">Ningún archivo seleccionado</span>
                </div>

                <div class="import-actions">
                    <button class="btn btn--primary btn--lg" id="importBtn" type="button" disabled>Importar</button>
                </div>
            </div>
        </article>
    </main>
</div>

<footer role="contentinfo">
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>

<script>
    (function(){
        const fileInput = document.getElementById('csvFile');
        const dropzone = document.getElementById('dropzone');
        const fileName = document.getElementById('fileName');
        const trigger = document.querySelector('.file-trigger');
        const importBtn = document.getElementById('importBtn');
        const mensaje = document.getElementById('mensaje');

        let archivoSeleccionado = null;

        function mostrarMensaje(texto, tipo){
            mensaje.textContent = texto;
            mensaje.className = 'alert ' + tipo;
            mensaje.style.display = 'block';
        }

        function setFile(file){
            if(!file) return;
            if(!file.name.toLowerCase().endsWith('.csv')){
                mostrarMensaje('Solo se permiten archivos .csv', 'alert-error');
                return;
            }
            archivoSeleccionado = file;
            fileName.textContent = file.name + ' · ' + Math.round(file.size/1024) + ' KB';
            importBtn.disabled = false;
            mensaje.style.display = 'none';
        }

        trigger.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', e => setFile(e.target.files[0]));

        ['dragenter','dragover'].forEach(ev => {
            dropzone.addEventListener(ev, e => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });
        });

        ['dragleave','drop'].forEach(ev => {
            dropzone.addEventListener(ev, e => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            });
        });

        dropzone.addEventListener('drop', e => {
            const file = e.dataTransfer.files && e.dataTransfer.files[0];
            setFile(file);
        });

        importBtn.addEventListener('click', () => {
            if(!archivoSeleccionado){
                mostrarMensaje('Seleccioná un archivo antes de importar', 'alert-error');
                return;
            }

            const formData = new FormData();
            formData.append('archivos', archivoSeleccionado);

            fetch('/admin/importar', {
                method: 'POST',
                body: formData
            })
                .then(async res => {
                    if(res.ok){
                        const text = await res.text(); // Si tu backend devuelve algo, opcional
                        mostrarMensaje('Archivo importado correctamente', 'alert-success');
                        archivoSeleccionado = null;
                        fileInput.value = '';
                        fileName.textContent = 'Ningún archivo seleccionado';
                        importBtn.disabled = true;
                    } else {
                        const err = await res.text();
                        mostrarMensaje('Error al importar archivo: ' + err, 'alert-error');
                    }
                })
                .catch(err => mostrarMensaje('Error al importar archivo: ' + err, 'alert-error'));
        });

    })();
</script>

</body>
</html>
