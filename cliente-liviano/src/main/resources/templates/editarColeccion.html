<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'MetaMapa · Editar colección — ' + ${coleccion.titulo}">
        MetaMapa · Editar colección
    </title>

    <!-- mismo CSS que nueva colección, solo que apuntando a otro archivo -->
    <link rel="stylesheet" th:href="@{/css/adminEditarColeccion.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/adminSidebar.css}" />
</head>
<body>
<!-- Header -->
<div th:replace="header :: mainHeader"></div>

<div class="layout">
    <!-- Sidebar -->
    <div th:replace="adminSidebar :: sidebarFragment"></div>

    <!-- Contenido -->
    <main class="main" role="main">
        <!-- Cabecera del form: título + botón -->
        <div class="form-header">
            <h1 class="page-title"
                th:text="'Editar colección: ' + ${coleccion.titulo}">
                Editar colección
            </h1>
            <a class="btn btn--outline"
               th:href="@{/admin/colecciones}"
               title="Volver a colecciones">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 3L2 12h3v8h6v-5h2v5h6v-8h3z"/>
                </svg>
                Volver a colecciones
            </a>
        </div>

        <!-- Contenedor centrado del formulario -->
        <div class="form-wrapper">
            <article class="card form-card-collection">

                <!-- Mensajes de éxito o error -->
                <div th:if="${mensajeExito}" class="alert alert-success"
                     th:text="${mensajeExito}"></div>
                <div th:if="${mensajeError}" class="alert alert-error"
                     th:text="${mensajeError}"></div>

                <!-- IMPORTANTE: usamos th:object con la colección existente -->
                <form th:action="@{/admin/coleccion/editar/{id}(id=${coleccion.id})}"
                      th:object="${coleccion}"
                      method="post">

                    <input type="hidden" th:field="*{id}" />

                    <div class="form-row">
                        <label for="titulo">Nombre de la colección</label>
                        <!-- th:field precarga el valor *y* bindea -->
                        <input type="text" id="titulo"
                               th:field="*{titulo}"
                               placeholder="Ej.: Incidentes en transporte público"
                               required>
                    </div>

                    <div class="form-row">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion"
                                  th:field="*{descripcion}"
                                  rows="4"
                                  placeholder="Contá brevemente…"
                                  required></textarea>
                    </div>

                    <div class="form-row">
                        <label for="algoritmo">Algoritmo de consenso</label>
                        <!-- acá asumo que la propiedad del DTO es algoritmoDeConsenso.
                             Si en tu DTO se llama 'algoritmo', cambiá a *{algoritmo}. -->
                        <select id="algoritmo"
                                th:field="*{algoritmoDeConsenso}"
                                required>
                            <option value="MAYORIA_SIMPLE">Mayoría simple</option>
                            <option value="MULTIPLES_MENCIONES">Múltiples menciones</option>
                            <option value="ABSOLUTA">Unanimidad</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn--primary" type="submit">
                            Guardar cambios
                        </button>
                    </div>
                </form>
            </article>
        </div>
    </main>
</div>

<!-- Footer -->
<footer role="contentinfo">
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>

<!-- Toggle sidebar en mobile -->
<script>
    (function(){
        const btn = document.querySelector('.sidebar__toggle');
        const sidebar = document.querySelector('.sidebar');
        if(!btn || !sidebar) return;
        btn.addEventListener('click', () => {
            const open = sidebar.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', String(open));
        });
    })();
</script>
</body>
</html>
