<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Error ' + ${codigo} + ' — MetaMapa'">Error</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            background: linear-gradient(135deg, #1a1a1a, #2e2e2e);
            color: #f5f5f5;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .error-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem 4rem;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            max-width: 500px;
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            font-size: 7rem;
            color: #133863;
            margin: 0;
            letter-spacing: 2px;
            animation: float 3s ease-in-out infinite;
        }

        p {
            font-size: 1.3rem;
            margin-top: 0.5rem;
            opacity: 0.9;
        }

        .boton-volver {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.9rem 1.8rem;
            background-color: rgba(13, 60, 113, 0.6);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
            font-weight: 600;
        }

        .boton-volver:hover {
            background-color: #133863;
            transform: scale(1.05);
        }

        /* Animaciones suaves */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 5rem;
            }
            p {
                font-size: 1rem;
            }
            .error-container {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1 th:text="${codigo}">404</h1>
    <p th:text="${mensaje}">La página que buscás no existe 🫤</p>
    <a href="/" class="boton-volver">Volver al inicio</a>
</div>
</body>
</html>
