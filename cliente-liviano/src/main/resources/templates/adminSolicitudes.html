<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetaMapa · Solicitudes de eliminación</title>
    <link rel="stylesheet" th:href="@{/css/adminLanding.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/adminSidebar.css}" />
</head>
<body>
<div th:replace="header :: mainHeader"></div>

<div class="layout">
    <!-- Sidebar -->
    <div th:replace="adminSidebar :: sidebarFragment"></div>

    <!-- Contenido principal -->
    <main class="main">
        <header class="page-header">
            <h1 class="page-title">Solicitudes de eliminación</h1>
        </header>

        <section class="solicitudes-grid" aria-label="Listado de solicitudes">
            <!-- Tarjetas generadas dinámicamente -->
            <article class="soli-card card" th:each="solicitud : ${solicitudes}">
                <a class="hecho-link" th:href="@{'./hechos.html#' + ${solicitud.hecho.tituloId}}"
                   th:text="${solicitud.hecho.titulo}">Hecho</a>

                <div class="soli__justif">
                    <div class="soli__label">Justificación</div>
                    <p th:text="${solicitud.justificacionDeEliminacion}">Justificación</p>
                </div>

                <div class="soli__footer">
                    <div class="soli__meta">
                        <span class="author">
                            <svg class="avatar" width="18" height="18" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M12 12a5 5 0 1 0-5-5a5 5 0 0 0 5 5m0 2c-4.33 0-8 2.17-8 5v1h16v-1c0-2.83-3.67-5-8-5Z"/>
                            </svg>
                            <span class="author__name" th:text="${solicitud.usuarioQueCargoLaSolicitud.nombre}">Autor</span>
                        </span>
                        <span class="date">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2m0 15H5V10h14z"/>
                            </svg>
                            <time th:datetime="${solicitud.fechaDeCargaDeSolicitud}"
                                  th:text="${#temporals.format(solicitud.fechaDeCargaDeSolicitud, 'dd/MM/yyyy · HH:mm')}">
                                Fecha
                            </time>
                        </span>
                    </div>

                    <div class="soli__actions">
                        <button class="btn btn--approve" type="button"
                                th:attr="data-id=${solicitud.idSolicitud}" aria-label="Aprobar solicitud">
                            Aprobar
                        </button>
                        <button class="btn btn--reject" type="button"
                                th:attr="data-id=${solicitud.idSolicitud}" aria-label="Rechazar solicitud">
                            Rechazar
                        </button>
                    </div>
                </div>
            </article>
        </section>
    </main>
</div>

<footer role="contentinfo">
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>

<!-- Toggle sidebar en mobile -->
<script>
    (function(){
        const btn = document.querySelector('.sidebar__toggle');
        const sidebar = document.querySelector('.sidebar');
        if(!btn || !sidebar) return;
        btn.addEventListener('click', () => {
            const open = sidebar.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', String(open));
        });
    })();
</script>
</body>
</html>
