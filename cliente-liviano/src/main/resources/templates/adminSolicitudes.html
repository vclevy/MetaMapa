<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Solicitudes de eliminación</title>
    <link rel="stylesheet" th:href="@{/css/adminSolicitudes.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/adminSidebar.css}">
</head>
<body>

<!-- Header -->
<div th:replace="header :: mainHeader"></div>

<div class="layout">
    <!-- Sidebar -->
    <div th:replace="adminSidebar :: sidebarFragment"></div>

    <!-- Contenido -->
    <main class="main" role="main">
        <div class="page-header">
            <h1 class="page-title">Solicitudes de eliminación</h1>
        </div>

        <!-- Filtros -->
        <section class="filters">
            <form method="get" class="filters-form">
                <div class="filter-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="">Todos</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="APROBADA">Aprobada</option>
                        <option value="RECHAZADA">Rechazada</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="usuario">Usuario</label>
                    <input id="usuario" name="usuario" type="text" placeholder="Buscar por usuario..."/>
                </div>

                <div class="filter-actions">
                    <button type="submit" class="btn btn--primary">Filtrar</button>
                    <a th:href="@{/admin/solicitudes}" class="btn">Limpiar</a>
                </div>
            </form>
        </section>

        <!-- Lista de solicitudes -->
        <section class="solicitudes-list">
            <div th:each="solicitud : ${solicitudes}" class="solicitud-card">

                <div class="solicitud-info">
                    <div class="solicitud-header">
                        <h2 th:text="'#' + ${solicitud.idSolicitud}">#1</h2>
                        <span class="badge"
                              th:classappend="' estado-' + ${solicitud.estado.toString().toLowerCase()}"
                              th:text="${solicitud.estado}">PENDIENTE</span>
                    </div>

                    <p class="hecho" th:text="${solicitud.hecho.titulo}">Título del hecho</p>
                    <p class="justificacion" th:text="${solicitud.justificacionDeEliminacion}">
                        Justificación del usuario...
                    </p>

                    <div class="meta">
                        <span th:text="'Usuario: ' + ${solicitud.usuarioQueCargoLaSolicitud.username}">usuario</span>
                        <span th:text="'Fecha: ' + ${#temporals.format(solicitud.fechaDeCargaDeSolicitud, 'dd/MM/yyyy HH:mm')}">
                            06/10/2025 14:30
                        </span>
                    </div>
                </div>

                <div class="solicitud-actions">
                    <a th:href="@{'/admin/solicitud/' + ${solicitud.idSolicitud}}" class="btn-ver">Ver</a>
                    <a th:if="${solicitud.estado.name() == 'PENDIENTE'}"
                       th:href="@{'/admin/solicitud/aprobar/' + ${solicitud.idSolicitud}}"
                       class="btn-aprobar">Aprobar</a>
                    <a th:if="${solicitud.estado.name() == 'PENDIENTE'}"
                       th:href="@{'/admin/solicitud/rechazar/' + ${solicitud.idSolicitud}}"
                       class="btn-rechazar">Rechazar</a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(solicitudes)}" class="no-data">
                <p>No hay solicitudes registradas.</p>
            </div>
        </section>

    </main>
</div>

<footer role="contentinfo">
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>

</body>
</html>
