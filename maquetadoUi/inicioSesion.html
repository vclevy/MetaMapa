<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/sesion.css">
  <title>MetaMapa - Iniciar Sesión</title>
</head>
<body>

<header>
    <div class="header-container">
        <a class="logo" href="index.html">
            <img src="img/logoMetamapa.png" alt="Logo MetaMapa" />
        </a>
        <nav class="nav-links">
            <a class="btn btn-primary" href="inicioSesion.html">Iniciar sesión</a>
            <a class="btn btn-primary" href="registro.html">Registrarse</a>
        </nav>
    </div>
</header>

<main class="main-content">
  <section class="intro">
    <h2>Iniciar sesión</h2>
    <p>Accedé a tu cuenta. Si todavía no tenés una, debés  <a href="registro.html">registrarte</a>.</p>
  </section>

  <section class="form-section">
    <form class="form-card">
      <label for="usuario">Nombre de usuario o mail</label>
      <input type="text" id="usuario" name="usuario" placeholder="Ingresá tu usuario o tu mail" required>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" placeholder="Ingresá tu contraseña" required>

      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>
  </section>
</main>

<footer>
  <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>
</body>
</html>
