<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetaMapa - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header>
  <div class="container header-container">
    <a href="index.html" class="logo">MetaMapa</a>
    <nav class="nav-main">
      <a class="btn btn-primary" href="registro.html">Registrarse</a>
    </nav>
  </div>
</header>


<main class="main-content">
  <section class="intro">
    <h2>Iniciar sesión</h2>
    <p>Accedé a tu cuenta para contribuir y explorar la memoria colectiva.</p>
  </section>

  <section class="form-section">
    <form class="form-card">
      <label for="usuario">Nombre de usuario</label>
      <input type="text" id="usuario" name="usuario" placeholder="Ingresá tu usuario" required>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" placeholder="Ingresá tu contraseña" required>

      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>
  </section>
</main>

<footer>
  <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>
</body>
</html>
