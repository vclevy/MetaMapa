<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetaMapa · Importar hechos</title>
    <link rel="stylesheet" href="css/adminLanding.css" />
</head>
<body>
<!-- Header -->
<header role="banner">
    <div class="header-container">
        <a class="logo" href="index.html" aria-label="Ir al home">
            <img src="img/logoMetamapa.png" alt="Logo MetaMapa" />
        </a>
        <nav class="admin-top-actions" aria-label="Acciones del admin"></nav>
    </div>
</header>

<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Menú lateral">
        <button class="sidebar__toggle" aria-label="Abrir/cerrar menú" aria-expanded="false">☰</button>
        <div class="sidebar__inner">
            <nav class="menu">
                <a class="menu__link" href="adminLanding.html">Resumen de actividad</a>
                <a class="menu__link" href="adminColecciones.html">Gestionar colecciones</a>
                <a class="menu__link" href="adminHechos.html">Gestionar hechos</a>
                <a class="menu__link" href="adminSolicitudes.html">Solicitudes de eliminación</a>
                <a class="menu__link is-active" href="adminImportar.html">Importar hechos</a>
            </nav>
        </div>
    </aside>

    <!-- Contenido -->
    <main class="main" role="main">
        <div class="page-header">
            <h1 class="page-title">Importar hechos</h1>
        </div>

        <article class="card import-card">
            <form class="import-form" action="#" method="post" enctype="multipart/form-data" novalidate>
                <p class="import-help">Cargar archivo con extensión <strong>.csv</strong></p>

                <!-- Dropzone + “Examinar…” -->
                <div class="dropzone" id="dropzone" tabindex="0" aria-label="Área para seleccionar o soltar un archivo .csv">
                    <input type="file" id="csvFile" name="csvFile" accept=".csv" required hidden>
                    <button class="file-trigger" type="button" aria-controls="csvFile">Examinar…</button>
                    <span class="file-hint">o arrastrá y soltá aquí</span>
                    <span class="file-name" id="fileName">Ningún archivo seleccionado</span>
                </div>

                <div class="import-actions">
                    <button class="btn btn--primary btn--lg" id="importBtn" type="submit" disabled>Importar</button>
                </div>
            </form>
        </article>
    </main>
</div>

<!-- Footer -->
<footer role="contentinfo">
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>

<!-- Scripts -->
<script>
    // Toggle sidebar en mobile (igual que en otras vistas)
    (function(){
        const btn = document.querySelector('.sidebar__toggle');
        const sidebar = document.querySelector('.sidebar');
        if(!btn || !sidebar) return;
        btn.addEventListener('click', () => {
            const open = sidebar.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', String(open));
        });
    })();

    // Lógica simple de importación (selector, drag & drop, habilitar botón)
    (function(){
        const fileInput = document.getElementById('csvFile');
        const dropzone  = document.getElementById('dropzone');
        const fileName  = document.getElementById('fileName');
        const trigger   = document.querySelector('.file-trigger');
        const importBtn = document.getElementById('importBtn');

        function setFile(file) {
            if(!file) return;
            if(!file.name.toLowerCase().endsWith('.csv')) {
                alert('Solo se permiten archivos .csv');
                return;
            }
            // asignar al input (para drag & drop)
            const dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;

            fileName.textContent = file.name + ' · ' + Math.round(file.size/1024) + ' KB';
            importBtn.disabled = false;
        }

        trigger.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => setFile(e.target.files[0]));

        // Drag & drop
        ['dragenter','dragover'].forEach(ev => {
            dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
        });
        ['dragleave','drop'].forEach(ev => {
            dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); });
        });
        dropzone.addEventListener('drop', (e) => {
            const file = e.dataTransfer.files && e.dataTransfer.files[0];
            setFile(file);
        });
    })();
</script>
</body>
</html>
