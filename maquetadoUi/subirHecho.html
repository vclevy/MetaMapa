<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Subir hecho — MetaMapa</title>

    <!-- (opcional) tu CSS de header si lo estás usando -->
    <!-- <link rel="stylesheet" href="css/header.css"> -->

    <!-- CSS específico de esta vista -->
    <link rel="stylesheet" href="css/subirHecho.css">
</head>
<body>
<header>
    <div class="container header-container">
        <a class="logo" href="index.html">
            <img src="img/logoMetamapa.png" alt="Logo MetaMapa" />
        </a>
        <nav class="nav-links">
            <a class="btn btn-primary" href="inicioSesion.html">Iniciar sesión</a>
            <a class="btn btn-primary" href="registro.html">Registrarse</a>
        </nav>
    </div>
</header>
<main>
    <section class="intro container">
        <h1>Subir hecho</h1>
        <p>Cargá un nuevo hecho para contribuir a la memoria colectiva.</p>
    </section>

    <section class="form-section">
        <form class="form-card" action="/hechos" method="post" enctype="multipart/form-data" novalidate>
            <h2>Datos del hecho</h2>

            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ej.: Marcha por la memoria" required>

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="4" placeholder="Contá brevemente qué pasó…" required></textarea>

            <div class="grid-two">
                <div>
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccioná una categoría</option>
                        <option value="memoria">Memoria</option>
                        <option value="derechos">Derechos humanos</option>
                        <option value="movilizacion">Movilización</option>
                        <option value="cultura">Cultura</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div>
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
            </div>

            <label for="ubicacion">Ubicación</label>
            <input type="text" id="ubicacion" name="ubicacion" placeholder="Barrio, calle o punto de referencia" required>

            <label for="multimedia">Subir multimedia</label>
            <input type="file" id="multimedia" name="multimedia" accept="image/,video/,audio/*" multiple>

            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </section>
</main>
</body>
</html>
