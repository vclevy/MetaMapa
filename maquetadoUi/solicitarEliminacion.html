<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Solicitar eliminación de hecho</title>
    <link rel="stylesheet" href="css/solicitarEliminacion.css" />
</head>
<body>

<!-- Header (tu mismo header) -->
<header>
    <div class="container header-container">
        <a class="logo" href="index.html">
            <img src="img/logoMetamapa.png" alt="Logo MetaMapa" />
        </a>
        <nav class="nav-links">
            <a class="btn btn-primary" href="inicioSesion.html">Iniciar sesión</a>
            <a class="btn btn-primary" href="registro.html">Registrarse</a>
        </nav>
    </div>
</header>

<main class="container main-wrap">
    <section class="form-card" aria-labelledby="titulo-form">
        <header class="form-head">
            <h1 id="titulo-form">Solicitar eliminación de hecho</h1>
            <p class="sub">
                Contanos por qué este hecho debería eliminarse. La justificación debe tener un mínimo de
                <strong>500</strong> caracteres.
            </p>
        </header>

        <form action="#" method="post" class="elim-form" novalidate>
            <div class="row one">
                <label for="justificacion">Justificación <span class="req">(mínimo 500 caracteres)</span></label>
                <textarea id="justificacion" name="justificacion" minlength="500" required
                          placeholder="Escribí una justificación detallada…"></textarea>
                <small class="help">El formulario no se enviará hasta alcanzar 500 caracteres como mínimo.</small>
            </div>

            <div class="actions">
                <a class="btn btn-outline" href="listadoHechos.html">Cancelar</a>
                <button class="btn btn-primary btn-submit" type="submit">Enviar solicitud</button>
            </div>
        </form>
    </section>
</main>

<!-- Footer (tu mismo footer) -->
<footer>
    <p>© 2025 MetaMapa - Todos los derechos reservados</p>
</footer>
</body>
</html>
