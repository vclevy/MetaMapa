spring.application.name=Agregador
server.port=8080
hechos.upload.dir=uploads
hechos.upload.url-path=/uploads/**
spring.jackson.serialization.write-dates-as-timestamps=false

spring.datasource.url=jdbc:mysql://localhost:3306/agregador_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Exponer todos los endpoints de Actuator (incluye /actuator/metrics)
management.endpoints.web.exposure.include=*

# Habilitar Datadog
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.api-key=e106ceff48cb70c8b2cc1a183c2cb02d
management.datadog.metrics.export.site=us5.datadoghq.com
management.datadog.metrics.export.step=10s

# Identificadores del servicio (opcional pero recomendado)
dd.service=agregador
dd.env=dev


# URL del backend de FuenteEstatica
fuente.estatica.base-url=http://localhost:8090/api/fuente-estatica
