spring.application.name=Agregador
server.port=8080
hechos.upload.dir=uploads
hechos.upload.url-path=/uploads/**
spring.jackson.serialization.write-dates-as-timestamps=false

spring.datasource.url=jdbc:mysql://localhost:3306/agregador_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Activa el tracing
# application.properties
management.tracing.enabled=false
management.tracing.sampling.probability=1.0 
# 100% de requests con traza (podés bajar a 0.1 en prod)

# Exportar trazas a Jaeger u OpenTelemetry Collector
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# URL del backend de FuenteEstatica
fuente.estatica.base-url=http://localhost:8082
